events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Định nghĩa upstream cho Blue và Green
    upstream shopping_web_blue {
        server shopping.web.blue:8080;
    }

    upstream shopping_web_green {
        server shopping.web.green:8080;
    }

    # Map để switch enviroment (có thể dùng biến môi trường hoặc sửa file này)
    # Mặc định đang set là "blue"
    map $host $active_upstream {
        default shopping_web_blue;
        # default shopping_web_green; # Uncomment dòng này và comment dòng trên để switch sang Green
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Proxy pass vào upstream đang active
            proxy_pass http://$active_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection keep-alive;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
